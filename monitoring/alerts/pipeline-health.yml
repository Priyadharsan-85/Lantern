groups:
  - name: lantern-pipeline-health
    rules:
      - alert: CollectorDown
        expr: up{job="collector"} == 0
        for: 1m
        labels:
          service: collector
          severity: critical
        annotations:
          summary: Collector service is down
          description: Prometheus has been unable to scrape the Lantern collector for more than 1 minute.

      - alert: SpanIngestionFailures
        expr: increase(lantern_spans_ingested_total{status="failed"}[5m]) > 0
        for: 1m
        labels:
          service: collector
          severity: warning
        annotations:
          summary: Span ingestion is failing
          description: Span batches have failed to enter the Redis queue during the last 5 minutes.

      - alert: HighCollectorLatency
        expr: histogram_quantile(0.95, sum(rate(lantern_processor_latency_ms_bucket[5m])) by (le)) > 1000
        for: 5m
        labels:
          service: collector
          severity: warning
        annotations:
          summary: High collector latency
          description: The 95th percentile collector span processing latency exceeds 1 second for 5 minutes.

      - alert: SpanProcessingFailures
        expr: increase(lantern_spans_ingested_total{status="processor_error"}[5m]) > 0
        for: 5m
        labels:
          service: collector
          severity: warning
        annotations:
          summary: Span processing is failing
          description: The collector failed to persist spans during the last 5 minutes; messages remain pending for retry.
