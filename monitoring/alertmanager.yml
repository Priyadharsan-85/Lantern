global:
  smtp_smarthost: ${SMTP_SMARTHOST}
  smtp_from: ${SMTP_FROM}
  smtp_auth_username: ${SMTP_USERNAME}
  smtp_auth_password_file: /tmp/smtp_password
  smtp_require_tls: true

route:
  receiver: 'ops-email'
  group_by: ['alertname', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 1h

receivers:
  - name: 'ops-email'
    email_configs:
      - to: '${ALERT_EMAIL}'
        send_resolved: true
