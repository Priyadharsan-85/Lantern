name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Prepare production environment file
        run: cp .env.production.example .env.production

      - name: Validate production Compose configuration
        run: docker compose --env-file .env.production -f docker-compose.prod.yml config --quiet

      - name: Build production images
        run: docker compose --env-file .env.production -f docker-compose.prod.yml build
