name: Production Dependency Audit

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "41 5 * * 1"

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit production dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Audit production dependency lockfiles
        run: |
          npm audit --omit=dev --audit-level=high --prefix dashboard
          npm audit --omit=dev --audit-level=high --prefix packages/collector
          npm audit --omit=dev --audit-level=high --prefix packages/sdk
          npm audit --omit=dev --audit-level=high --prefix services/api-gateway
          npm audit --omit=dev --audit-level=high --prefix services/order-service
          npm audit --omit=dev --audit-level=high --prefix services/payment-service
