services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - .env.production
    environment:
      POSTGRES_DB: ${PGDATABASE:?Set PGDATABASE in .env.production}
      POSTGRES_USER: ${PGUSER:?Set PGUSER in .env.production}
      POSTGRES_PASSWORD: ${PGPASSWORD:?Set PGPASSWORD in .env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - lantern
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:?Set PGUSER in .env.production} -d ${PGDATABASE:?Set PGDATABASE in .env.production}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  migrate:
    image: postgres:16-alpine
    env_file:
      - .env.production
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${PGUSER:?Set PGUSER in .env.production}
      PGPASSWORD: ${PGPASSWORD:?Set PGPASSWORD in .env.production}
      PGDATABASE: ${PGDATABASE:?Set PGDATABASE in .env.production}
    volumes:
      - ./infra/migrations:/migrations:ro
      - ./infra/migrate.sh:/migrate.sh:ro
    entrypoint: ["/bin/sh", "/migrate.sh"]
    networks:
      - lantern
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  redis:
    image: redis:7-alpine
    networks:
      - lantern
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  collector:
    build: .
    env_file:
      - .env.production
    environment:
      SERVICE: collector
      NODE_ENV: production
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${PGUSER:?Set PGUSER in .env.production}
      PGPASSWORD: ${PGPASSWORD:?Set PGPASSWORD in .env.production}
      PGDATABASE: ${PGDATABASE:?Set PGDATABASE in .env.production}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CORS_ORIGIN: ${CORS_ORIGIN:?Set CORS_ORIGIN in .env.production}
      COLLECTOR_API_KEY: ${COLLECTOR_API_KEY:?Set COLLECTOR_API_KEY in .env.production}
      SPANS_RATE_LIMIT_MAX: ${SPANS_RATE_LIMIT_MAX:?Set SPANS_RATE_LIMIT_MAX in .env.production}
      SPANS_RATE_LIMIT_WINDOW_MS: ${SPANS_RATE_LIMIT_WINDOW_MS:?Set SPANS_RATE_LIMIT_WINDOW_MS in .env.production}
    networks:
      - lantern
    expose:
      - "4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api-gateway:
    build: .
    env_file:
      - .env.production
    environment:
      SERVICE: api-gateway
      NODE_ENV: production
      COLLECTOR_URL: http://collector:4000
      COLLECTOR_API_KEY: ${COLLECTOR_API_KEY:?Set COLLECTOR_API_KEY in .env.production}
      ORDER_SERVICE_URL: http://order-service:4001
      DASHBOARD_ORIGIN: ${DASHBOARD_ORIGIN:?Set DASHBOARD_ORIGIN in .env.production}
      DASHBOARD_AUTH_USER: ${DASHBOARD_AUTH_USER:?Set DASHBOARD_AUTH_USER in .env.production}
      DASHBOARD_AUTH_PASSWORD: ${DASHBOARD_AUTH_PASSWORD:?Set DASHBOARD_AUTH_PASSWORD in .env.production}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env.production}
    networks:
      - lantern
    expose:
      - "3000"
    depends_on:
      collector:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  order-service:
    build: .
    env_file:
      - .env.production
    environment:
      SERVICE: order-service
      NODE_ENV: production
      COLLECTOR_URL: http://collector:4000
      COLLECTOR_API_KEY: ${COLLECTOR_API_KEY:?Set COLLECTOR_API_KEY in .env.production}
      PAYMENT_SERVICE_URL: http://payment-service:4002
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${PGUSER:?Set PGUSER in .env.production}
      PGPASSWORD: ${PGPASSWORD:?Set PGPASSWORD in .env.production}
      PGDATABASE: ${PGDATABASE:?Set PGDATABASE in .env.production}
    networks:
      - lantern
    expose:
      - "4001"
    depends_on:
      collector:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  payment-service:
    build: .
    env_file:
      - .env.production
    environment:
      SERVICE: payment-service
      NODE_ENV: production
      COLLECTOR_URL: http://collector:4000
      COLLECTOR_API_KEY: ${COLLECTOR_API_KEY:?Set COLLECTOR_API_KEY in .env.production}
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${PGUSER:?Set PGUSER in .env.production}
      PGPASSWORD: ${PGPASSWORD:?Set PGPASSWORD in .env.production}
      PGDATABASE: ${PGDATABASE:?Set PGDATABASE in .env.production}
      PAYMENT_FAILURE_RATE: ${PAYMENT_FAILURE_RATE:?Set PAYMENT_FAILURE_RATE in .env.production}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:?Set PAYMENT_PROVIDER in .env.production}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?Set STRIPE_SECRET_KEY in .env.production}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:?Set STRIPE_WEBHOOK_SECRET in .env.production}
      PAYMENT_CURRENCY: ${PAYMENT_CURRENCY:?Set PAYMENT_CURRENCY in .env.production}
      PAYMENT_PRODUCT_NAME: ${PAYMENT_PRODUCT_NAME:?Set PAYMENT_PRODUCT_NAME in .env.production}
      STRIPE_SUCCESS_URL: ${STRIPE_SUCCESS_URL:?Set STRIPE_SUCCESS_URL in .env.production}
      STRIPE_CANCEL_URL: ${STRIPE_CANCEL_URL:?Set STRIPE_CANCEL_URL in .env.production}
    networks:
      - lantern
    expose:
      - "4002"
    depends_on:
      collector:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4002/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        VITE_COLLECTOR_URL: ${VITE_COLLECTOR_URL:?Set VITE_COLLECTOR_URL in .env.production}
    networks:
      - lantern
    expose:
      - "80"
    depends_on:
      collector:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    env_file:
      - .env.production
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env.production}
      DASHBOARD_DOMAIN: ${DASHBOARD_DOMAIN:?Set DASHBOARD_DOMAIN in .env.production}
      TLS_EMAIL: ${TLS_EMAIL:?Set TLS_EMAIL in .env.production}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - lantern
    depends_on:
      - api-gateway
      - dashboard
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - lantern
    expose:
      - "9090"
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    env_file:
      - .env.production
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    networks:
      - lantern
    expose:
      - "9093"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?Set GRAFANA_ADMIN_USER in .env.production}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env.production}
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - lantern
    expose:
      - "3000"
    restart: unless-stopped

networks:
  lantern:
    driver: bridge
    internal: false

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:
